<!DOCTYPE html>
<html class="h-full" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athlete Portal // ZYRO-Shoes</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float-slow {

            0%,
            100% {
                transform: translateY(0px) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.05);
            }
        }

        @keyframes float-fast {

            0%,
            100% {
                transform: translateY(0px) translateX(0px);
            }

            50% {
                transform: translateY(15px) translateX(10px);
            }
        }

        .animate-float-slow {
            animation: float-slow 8s ease-in-out infinite;
        }

        .animate-float-fast {
            animation: float-fast 5s ease-in-out infinite;
        }
    </style>
    <script>
        function switchTab(tab) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const signinBtn = document.getElementById('tab-signin-btn');
            const signupBtn = document.getElementById('tab-signup-btn');
            const pageTitle = document.getElementById('page-title');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                signinBtn.className = "flex-1 py-2.5 rounded-full bg-black text-white text-xs font-bold uppercase tracking-wider transition shadow-sm";
                signupBtn.className = "flex-1 py-2.5 rounded-full text-gray-500 hover:text-black text-xs font-bold uppercase tracking-wider transition";
                pageTitle.innerText = "Sign In";
            } else {
                signinForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupBtn.className = "flex-1 py-2.5 rounded-full bg-[#e21e49] text-white text-xs font-bold uppercase tracking-wider transition shadow-sm";
                signinBtn.className = "flex-1 py-2.5 rounded-full text-gray-500 hover:text-black text-xs font-bold uppercase tracking-wider transition";
                pageTitle.innerText = "Create Account";
            }
        }
    </script>
</head>

<body
    class="bg-[#f9f9fa] font-['Inter'] text-[#1a1c1d] antialiased flex flex-col min-h-screen relative overflow-x-hidden">

    <!-- Animated Kinetic Background Shapes -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/10 w-96 h-96 bg-[#e21e49]/10 rounded-full blur-3xl animate-float-slow">
        </div>
        <div
            class="absolute bottom-1/4 right-1/10 w-[450px] h-[450px] bg-black/5 rounded-full blur-3xl animate-float-fast">
        </div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-[#f9f9fa]/85 backdrop-blur-xl border-b border-gray-200">
        <div class="h-20 px-6 md:px-12 flex items-center justify-between">
            <a href="index.html" class="flex items-baseline tracking-tight">
                <span class="font-['Space_Grotesk'] text-xl font-bold tracking-tighter">ZYRO</span>
                <span class="inline-block w-2 h-2 rounded-full bg-[#e21e49] mx-1"></span>
                <span class="font-['Space_Grotesk'] text-[11px] tracking-[0.25em] font-semibold">SHOES</span>
            </a>
            <a href="index.html"
                class="text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-black transition">Return to
                Store</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center pt-28 pb-16 px-4 relative z-10">
        <div class="max-w-md w-full bg-white/90 backdrop-blur-md rounded-[2rem] shadow-2xl border border-gray-100 p-8">

            <div class="text-center mb-6">
                <h1 id="page-title" class="font-['Space_Grotesk'] text-2xl font-bold uppercase tracking-tight">Sign In
                </h1>
                <p class="text-xs text-gray-500 mt-1">Manage your ZYRO Athlete orders & profile</p>
            </div>

            <!-- Tab Switcher Bar -->
            <div class="flex bg-gray-100 p-1 rounded-full mb-6">
                <button id="tab-signin-btn" onclick="switchTab('signin')"
                    class="flex-1 py-2.5 rounded-full bg-black text-white text-xs font-bold uppercase tracking-wider transition shadow-sm">
                    Sign In
                </button>
                <button id="tab-signup-btn" onclick="switchTab('signup')"
                    class="flex-1 py-2.5 rounded-full text-gray-500 hover:text-black text-xs font-bold uppercase tracking-wider transition">
                    Sign Up
                </button>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Email
                        Address</label>
                    <input type="email" id="signin-email" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-black transition bg-white/50"
                        placeholder="athlete@zyro.com" />
                </div>
                <div>
                    <label
                        class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Password</label>
                    <input type="password" id="signin-password" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-black transition bg-white/50"
                        placeholder="••••••••" />
                </div>
                <button type="submit"
                    class="w-full py-3.5 rounded-full bg-black text-white text-xs font-bold uppercase tracking-wider hover:bg-neutral-800 transition shadow-md cursor-pointer">
                    Sign In to Portal
                </button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signup-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Full
                        Name</label>
                    <input type="text" id="signup-name" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-black transition bg-white/50"
                        placeholder="Alex Mercer" />
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Email
                        Address</label>
                    <input type="email" id="signup-email" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-black transition bg-white/50"
                        placeholder="athlete@zyro.com" />
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-600 mb-1">Create
                        Password</label>
                    <input type="password" id="signup-password" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-black transition bg-white/50"
                        placeholder="••••••••" />
                </div>
                <button type="submit"
                    class="w-full py-3.5 rounded-full bg-[#e21e49] text-white text-xs font-bold uppercase tracking-wider hover:bg-[#be163d] transition shadow-md cursor-pointer">
                    Create Athlete Account
                </button>
            </form>

        </div>
    </main>
</body>

<!-- Firebase SDK Logic with Email Verification -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBQQXt2eTOsUCu6yuMBLXT7zEPPbh3X0LI",
        authDomain: "login-1d6c9.firebaseapp.com",
        projectId: "login-1d6c9",
        storageBucket: "login-1d6c9.firebasestorage.app",
        messagingSenderId: "213307730519",
        appId: "1:213307730519:web:13723ac061675abc931112",
        measurementId: "G-E8ENYZ9SDD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Sign In Logic & Redirect
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signin-email').value;
        const password = document.getElementById('signin-password').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "index.html";
        } catch (error) {
            alert("Login Failed: " + error.message);
        }
    });

    // Sign Up Logic with Email Verification Trigger
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        try {
            // User Create Karein
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Verification Email Bhejein
            await sendEmailVerification(user);

            alert("Account created successfully! A verification link has been sent to your email. Please check your inbox.");

            // User ko login tab par switch kar dein ya index par bhej dein
            window.location.href = "index.html";
        } catch (error) {
            alert("Sign Up Failed: " + error.message);
        }
    });
</script>

</html>
